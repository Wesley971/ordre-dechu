# Vérifie chaque modification, à chaque push et à chaque pull request (MAE-23)
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Ne pas renommer ce job sans le ruleset de main : son nom est la vérification obligatoire avant fusion.
  # Sous un autre nom, toutes les fusions resteraient bloquées, en attente d'un contrôle qui n'arrive jamais.
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      # Graine fixée : le même combat à chaque exécution
      - name: Battle check
        run: npm run check:battle -- 2026
      - name: Build
        run: npm run build
