<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Mini RPG - L’Ordre Déchu">
  <meta property="og:description" content="Une aventure interactive dans un monde sombre et fantastique.">
  <meta property="og:image" content="https://wesley971.github.io/Mini-RPG/images/preview.png">
  <meta property="og:url" content="https://wesley971.github.io/Mini-RPG/">
  <meta property="og:type" content="website">
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500&display=swap" rel="stylesheet">


  <title>L’Ordre Déchu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="lock-scroll">
  <!-- Écran d’intro -->
  <div id="intro-screen">
    <h1>🩸 L’Ordre Déchu</h1>
    <p class="subtitle">Une aventure de Maelor du Val Ténébreux</p>
    <button id="start-btn">🎬 Commencer l’aventure</button>
  </div>

  <!-- Contenu principal du jeu -->
  <div id="game">
    <!-- Zone du héros -->
    <div id="player" class="character">
      <h2><img src="images/geralt-emoji.png" alt="Geralt le Héros" class="emoji-hero">Maelor du Val Ténébreux</h2>
      <div class="health-bar">
        <div id="player-hp-bar" class="bar"></div>
      </div>
      <p id="player-hp-text">HP: 20</p>
      <p id="player-xp-text">XP : 0</p>
      <p id="player-level-text">Niveau : 1</p>


    </div>

    <!-- Zone de l’ennemi -->
    <div id="enemy" class="character">
      <h2><img id="enemy-image" src="images/gobelin.png" alt="Ennemi" class="emoji-enemy">
         <span id="enemy-name">Gobelin</span></h2>
      <div class="health-bar">
        <div id="enemy-hp-bar" class="bar"></div>
      </div>
      <p id="enemy-hp-text">HP: 10</p>
    </div>

    <!-- Boutons d’action -->
    <div id="choices">
      <button id="fight-btn">⚔ Attaquer</button>
      <button id="heal-btn">🧪 Se soigner</button>
      <button id="run-btn">🏃 Fuir</button>
    </div>

    <!-- Texte narratif -->
    <div id="story">
      Une brume épaisse recouvre la forêt... un bruit de pas approche.
    </div>

    <!-- Bouton "Continuer" -->
    <div id="continue-button">
      <button id="launch-btn">➡️ Continuer</button>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="script.js"></script>
  <script src="ui.js"></script>
  <script src="player.js"></script>

</body>
</html>
