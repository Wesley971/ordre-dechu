<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="Mini RPG - L'Ordre Déchu">
  <meta property="og:description" content="Une aventure interactive dans un monde sombre et fantastique.">
  <meta property="og:image" content="https://wesley971.github.io/Mini-RPG/images/preview.png">
  <meta property="og:url" content="https://wesley971.github.io/Mini-RPG/">
  <meta property="og:type" content="website">
  <meta name="color-scheme" content="dark light">
  <title>L'Ordre Déchu</title>
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="lock-scroll">

  <!-- ── ÉCRAN TITRE ─────────────────────────────────────────────── -->
  <div id="intro-screen">
    <header class="logo">
      <div class="rule"></div>
      <h1>L'Ordre<br>Déchu</h1>
      <div class="rule"></div>
      <p class="logo-sub">Une aventure de Maelor du Val Ténébreux</p>
    </header>
    <div class="window title-menu">
      <button id="retry-btn" class="menu-item title-option" hidden>Réessayer le combat</button>
      <button id="start-btn" class="menu-item title-option">Nouvelle partie</button>
    </div>
    <p class="intro-keys">Flèches · Entrée pour valider · Échap pour revenir — ou une manette</p>
  </div>

  <!-- ── JEU ────────────────────────────────────────────────────── -->
  <main id="game" hidden>

    <!-- Scène : ennemis à gauche, groupe à droite -->
    <section id="battle-scene" class="window">
      <div id="battle-banner" class="window" hidden></div>
      <div id="enemy-area"></div>
      <div id="hero-area"></div>
    </section>

    <!-- Fenêtres du bas -->
    <section id="battle-hud">
      <div id="left-window" class="window">
        <ul id="enemy-list"></ul>
        <div id="command-window" hidden></div>
        <div id="target-hint" hidden>Choisis une cible<br><span>◀ Retour</span></div>
      </div>

      <div id="party-window" class="window">
        <div class="party-row party-head">
          <span>Nom</span><span>PV</span><span>PM</span><span>Temps</span>
        </div>
        <div id="party-rows"></div>
      </div>

      <div id="list-window" class="window" hidden></div>
    </section>

  </main>

  <!-- Dialogues : histoire, résultats, fin -->
  <div id="dialog" class="window" hidden>
    <div id="dialog-title" class="window-title"></div>
    <div id="dialog-text"></div>
    <ul id="dialog-choices" class="menu" hidden></ul>
    <div id="dialog-next">▼</div>
  </div>

  <div id="flash"></div>
  <button id="sound-btn" class="window" title="Son" aria-label="Couper / remettre le son">♪</button>

  <script src="config.js"></script>
  <script src="player.js"></script>
  <script src="data.js"></script>
  <script src="sfx.js"></script>
  <script src="input.js"></script>
  <script src="battle.js"></script>
  <script src="menu.js"></script>
  <script src="ui.js"></script>
  <script src="dialog.js"></script>
  <script src="script.js"></script>

</body>
</html>
