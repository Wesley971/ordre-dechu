<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:title" content="L'Ordre Déchu">
  <meta property="og:description" content="Une aventure interactive dans un monde sombre et fantastique.">
  <meta property="og:image" content="https://wesley971.github.io/ordre-dechu/images/preview.png">
  <meta property="og:url" content="https://wesley971.github.io/ordre-dechu/">
  <meta property="og:type" content="website">
  <meta name="color-scheme" content="dark light">
  <title>L'Ordre Déchu</title>
  <link rel="stylesheet" href="/src/styles/design-system.css">
  <link rel="stylesheet" href="/src/styles/style.css">
</head>
<body class="lock-scroll">

  <!-- ── ÉCRAN TITRE ─────────────────────────────────────────────── -->
  <div id="intro-screen">
    <header class="logo">
      <div class="rule"></div>
      <h1>L'Ordre<br>Déchu</h1>
      <div class="rule"></div>
      <p class="logo-sub">Une aventure de Maelor du Val Ténébreux</p>
    </header>
    <div class="window title-menu">
      <button id="retry-btn" class="menu-item title-option" hidden>Réessayer le combat</button>
      <button id="continue-btn" class="menu-item title-option" hidden>Continuer</button>
      <button id="start-btn" class="menu-item title-option">Nouvelle partie</button>
    </div>
    <p class="intro-keys">Flèches · Entrée pour valider · Échap pour revenir — ou une manette</p>
  </div>

  <!-- ── JEU ────────────────────────────────────────────────────── -->
  <main id="game" hidden>

    <!-- Scène en plein écran : les combattants des chapitres sans décor peint (en DOM), le bandeau -->
    <section id="battle-scene">
      <div id="battle-banner" hidden></div>
      <div id="battle-arena">
        <div id="enemy-area"></div>
        <div id="hero-area"></div>
      </div>
    </section>

    <!-- Interface posée sur la scène (maquette D2, MAE-87) : le groupe en haut à gauche, le menu en bas à gauche -->
    <section id="battle-hud">
      <section id="party-window" class="hud-plate" aria-label="Le groupe">
        <div id="party-rows" class="od-hud"></div>
      </section>

      <nav id="action-window" class="hud-plate" aria-label="Commandes" hidden>
        <div id="list-window" hidden></div>
        <div id="command-window" hidden></div>
        <div id="target-hint" hidden><div id="target-help" hidden></div>Choisis une cible<br><span>◀ Retour</span></div>
      </nav>
    </section>

  </main>

  <!-- Dialogues : histoire, résultats, fin -->
  <div id="dialog" class="window" hidden>
    <div id="dialog-title" class="window-title"></div>
    <div id="dialog-text"></div>
    <ul id="dialog-choices" class="menu" hidden></ul>
    <div id="dialog-next">▼</div>
  </div>

  <div id="flash"></div>
  <button id="sound-btn" class="window" title="Son" aria-label="Couper / remettre le son">♪</button>

  <script type="module" src="/src/main.ts"></script>

</body>
</html>
